name: One-time content migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/old-essays

      - name: Copy selected essays and legacy images
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Rao0423/old-website-backup.git /tmp/old-site
          mkdir -p _posts assets/img/legacy
          rm -f _posts/.placeholder

          cp /tmp/old-site/_posts/2018-05-01-Symposium.md _posts/2018-05-01-Symposium.md
          cp /tmp/old-site/_posts/2020-05-15-educationphilosophy.md _posts/2020-05-15-educationphilosophy.md
          cp /tmp/old-site/_posts/2021-6-3-artphilosophy.md _posts/2021-06-03-artphilosophy.md
          cp /tmp/old-site/_posts/2021-12-23-discoelysium.md _posts/2021-12-23-discoelysium.md
          cp /tmp/old-site/_posts/2022-02-28-Alchemystars.md _posts/2022-02-28-Alchemystars.md

          cp -R /tmp/old-site/Images/. assets/img/legacy/

          for file in _posts/*.md; do
            sed -i '/^author:[[:space:]]*Rao[[:space:]]*$/d' "$file"
            sed -i 's/^abstract:/description:/' "$file"
            sed -i 's#src="/Images/#src="/assets/img/legacy/#g' "$file"
            sed -i "s#src='/Images/#src='/assets/img/legacy/#g" "$file"
            sed -i 's#](/Images/#](/assets/img/legacy/#g' "$file"
          done

      - name: Commit migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/img/legacy
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Migrate selected essays and legacy images"
          git push origin HEAD:migration/old-essays
