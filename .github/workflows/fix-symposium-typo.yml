name: Fix Symposium typo

on:
  push:
    paths:
      - '.github/workflows/fix-symposium-typo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix figure reference typo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('_posts/2018-05-01-Symposium.md')
          text = path.read_text(encoding='utf-8')
          old = '苏格拉底的爱欲观念亦能给予我们欣赏艺术品新的视角。洛可可艺术家让·奥诺雷·弗拉贡纳尔在这幅画（图6）'
          new = '苏格拉底的爱欲观念亦能给予我们欣赏艺术品新的视角。洛可可艺术家让·奥诺雷·弗拉贡纳尔在这幅画（图7）'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 match, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2018-05-01-Symposium.md
          git commit -m 'Fix Symposium figure reference typo'
          git push
