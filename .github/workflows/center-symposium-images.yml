name: Center Symposium images

on:
  push:
    paths:
      - '.github/workflows/center-symposium-images.yml'

permissions:
  contents: write

jobs:
  center-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Center all artwork images in Symposium post
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('_posts/2018-05-01-Symposium.md')
          text = path.read_text(encoding='utf-8')

          # Modernize the figure centering itself.
          text = text.replace('<figure align="center">', '<figure style="text-align: center;">')

          # Ensure every image in this post is horizontally centered, while preserving width.
          def fix_img(match):
              tag = match.group(0)
              style_match = re.search(r'style="([^"]*)"', tag)
              if style_match:
                  style = style_match.group(1).strip()
                  additions = []
                  if 'display:' not in style:
                      additions.append('display: block')
                  if 'margin-left:' not in style:
                      additions.append('margin-left: auto')
                  if 'margin-right:' not in style:
                      additions.append('margin-right: auto')
                  if additions:
                      if style and not style.endswith(';'):
                          style += ';'
                      if style:
                          style += ' '
                      style += '; '.join(additions) + ';'
                      tag = tag[:style_match.start(1)] + style + tag[style_match.end(1):]
              else:
                  tag = tag[:-1] + ' style="display: block; margin-left: auto; margin-right: auto;">'
              return tag

          text = re.sub(r'<img\b[^>]*>', fix_img, text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2018-05-01-Symposium.md
          git commit -m 'Center artwork images in Symposium post'
          git push
