name: Fix legacy image alt attributes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Add empty alt attributes to legacy raw img tags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('_posts/2018-05-01-Symposium.md'),
              Path('_posts/2021-06-03-artphilosophy.md'),
              Path('_posts/2021-12-23-discoelysium.md'),
              Path('_posts/2022-02-28-Alchemystars.md'),
          ]

          pattern = re.compile(r'<img(?![^>]*\balt\s*=)([^>]*)>', re.IGNORECASE)
          for path in targets:
              text = path.read_text(encoding='utf-8')
              fixed = pattern.sub(r'<img alt=""\1>', text)
              path.write_text(fixed, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix alt attributes on legacy article images"
          git push origin main
