{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<link rel="icon" type="image/png" href="{{ favicon_path }}/icon.png?v=2">
<link rel="shortcut icon" type="image/png" href="{{ favicon_path }}/icon.png?v=2">
<link rel="apple-touch-icon" href="{{ favicon_path }}/icon.png?v=2">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest?v=2">
{% endif %}
