<!-- Custom top navigation -->
<header id="topbar-wrapper" class="rao-topbar flex-shrink-0" aria-label="Top Bar">
  <div id="topbar" class="rao-topbar-inner d-flex align-items-center justify-content-between h-100">
    <!-- Kept for Chirpy's built-in scripts; intentionally hidden. -->
    <button type="button" id="sidebar-trigger" class="d-none" aria-label="Sidebar"></button>
    <div id="topbar-title" class="d-none"></div>

    <nav class="rao-primary-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/essays/' | relative_url }}"{% if page.url == '/essays/' %} class="active"{% endif %}>Essays</a>
      <a href="{{ '/notes/' | relative_url }}"{% if page.url == '/notes/' %} class="active"{% endif %}>Notes</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} class="active"{% endif %}>Archive</a>
    </nav>

    <div class="rao-nav-tools d-flex align-items-center">
      <button type="button" id="search-trigger" class="btn btn-link rao-search-trigger" aria-label="Search">
        <span>Search</span><i class="fas fa-search fa-fw"></i>
      </button>

      <search id="search" class="align-items-center">
        <i class="fas fa-search fa-fw"></i>
        <input
          class="form-control"
          id="search-input"
          type="search"
          aria-label="search"
          autocomplete="off"
          placeholder="{{ site.data.locales[include.lang].search.hint | capitalize }}..."
        >
      </search>
      <button type="button" class="btn btn-link text-decoration-none" id="search-cancel">
        {{- site.data.locales[include.lang].search.cancel -}}
      </button>

      {% unless site.theme_mode == 'light' or site.theme_mode == 'dark' %}
        <div class="btn-group rao-mode-group">
          <button
            type="button"
            class="btn btn-link rao-mode-toggle"
            aria-label="Switch Mode"
            id="mode-toggle"
            data-bs-toggle="dropdown"
          >
            <i class="fa-regular fa-sun" data-theme-mode="light"></i>
            <i class="fa-regular fa-moon" data-theme-mode="dark"></i>
            <i class="fa-solid fa-circle-half-stroke" data-theme-mode="system"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end rounded-3 mt-1 p-1">
            <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-mode="light"><i class="fa-regular fa-sun me-2"></i>{{ site.data.locales[include.lang].theme.light }}</button></li>
            <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-mode="dark"><i class="fa-regular fa-moon me-2"></i>{{ site.data.locales[include.lang].theme.dark }}</button></li>
            <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-mode="system"><i class="fa-solid fa-circle-half-stroke me-2"></i>{{ site.data.locales[include.lang].theme.system }}</button></li>
          </ul>
        </div>
      {% endunless %}
    </div>
  </div>
</header>
